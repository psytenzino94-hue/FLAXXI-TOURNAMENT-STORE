services:
  - type: web
    name: flaxxi-esports
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    plan: free
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_USERNAME
        value: flaxxiadmin
      - key: ADMIN_PASSWORD
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: flaxxi-esports-db
          property: connectionString

databases:
  - name: flaxxi-esports-db
    plan: free
